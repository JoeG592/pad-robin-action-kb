<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PAD Robin KB promo</title>
<style>
/* Selawik: Microsoft's open-source Segoe UI fallback. Cascadia Mono: Microsoft's open-source code font. */
@font-face { font-family: "UI"; src: url("fonts/Selawik-Semilight.ttf"); font-weight: 300; }
@font-face { font-family: "UI"; src: url("fonts/Selawik-Regular.ttf"); font-weight: 400; }
@font-face { font-family: "UI"; src: url("fonts/Selawik-Semibold.ttf"); font-weight: 600; }
@font-face { font-family: "UI"; src: url("fonts/Selawik-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "Code"; src: url("fonts/CascadiaMono.ttf"); }
:root { --accent: #0F6CBD; --ink: #1B1B1B; --mute: #5C5C5C; --bg1: #EEF1F5; --bg2: #E2E7EE; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: var(--fw); height: var(--fh); overflow: hidden; background: var(--bg1); }
body { font-family: "UI", "Segoe UI", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(180deg, var(--bg1), var(--bg2)); opacity: var(--shot, 1); }

/* PAD window */
.world { position: absolute; left: 0; top: 0; width: var(--fw); height: var(--fh); transform-origin: 0 0; will-change: transform; }
.win { position: absolute; border-radius: 8px; overflow: hidden; background: #fff;
  box-shadow: 0 1px 2px rgba(20,30,50,.08), 0 14px 40px rgba(20,30,50,.16); }
.win-img { position: absolute; inset: 0; background-repeat: no-repeat; }
.viewport { position: absolute; overflow: hidden; }
.strip { position: absolute; left: 0; top: 0; background-repeat: no-repeat; }
.sbmask { position: absolute; right: 0; top: 0; bottom: 0; background: #fff; }
.badge { position: absolute; }
.cursor { position: absolute; left: 0; top: 0; width: 22px; height: 22px; transform-origin: 0 0; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.35)); }
.keyhint { position: absolute; left: 0; top: 0; font: 600 15px "UI"; color: #fff; background: rgba(24,24,24,.86); padding: 5px 10px; border-radius: 6px; }

/* overlays */
.caption { position: absolute; left: 50%; bottom: 46px; max-width: 86%; text-align: center; font-size: 34px; font-weight: 600; line-height: 1.3;
  color: #fff; background: rgba(22,22,22,.88); padding: 12px 26px; border-radius: 14px; letter-spacing: -0.005em;
  transform: translateX(-50%) translateY(var(--rise, 0px)); }
.f4x5 .caption { bottom: 120px; font-size: 40px; }
.chip { position: absolute; right: 7%; top: 5.5%; font: 600 22px "UI"; color: var(--accent); background: #fff; border: 1px solid #CFE0F3;
  padding: 8px 16px; border-radius: 999px; box-shadow: 0 2px 8px rgba(20,30,50,.08); transform: translateY(var(--rise, 0px)); }
.f4x5 .chip { top: 965px; right: 50%; transform: translateX(50%) translateY(var(--rise, 0px)); }
.title { position: absolute; left: 5%; top: 5.5%; font: 600 26px "UI"; color: var(--ink); }
.f4x5 .title { top: 64px; left: 50%; transform: translateX(-50%); white-space: nowrap; }

/* how it works */
.how { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 34px; padding: 0 9% 150px; }
.f4x5 .how { padding: 0 6% 260px; gap: 30px; }
.how-col { width: 100%; max-width: 1380px; }
.how-lbl { font: 600 22px "UI"; color: var(--mute); margin-bottom: 10px; }
.how-code { font: 25px/1.55 "Code"; white-space: pre-wrap; word-break: normal; overflow-wrap: anywhere; background: #fff; border: 1px solid #DADFE6;
  border-radius: 8px; padding: 18px 24px; color: #242424; box-shadow: 0 1px 2px rgba(20,30,50,.05); }
.f4x5 .how-code { font-size: 21px; }
.how-row { background-repeat: no-repeat; background-color: #fff; border: 1px solid #DADFE6; border-radius: 8px; width: 100%; box-shadow: 0 1px 2px rgba(20,30,50,.05); }

/* proof + CTA */
.proof, .cta { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 9%; }
.proof { flex-direction: row; align-items: center; justify-content: space-between; gap: 6%; padding-bottom: 80px; }
.proof-strip { width: 720px; height: 780px; flex: none; border-radius: 8px; background-color: #fff; background-repeat: no-repeat;
  box-shadow: 0 1px 2px rgba(20,30,50,.08), 0 14px 40px rgba(20,30,50,.14);
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 12%, #000 88%, transparent 100%); }
.f4x5 .proof { flex-direction: column; justify-content: center; align-items: flex-start; gap: 44px; padding: 0 8% 220px; }
.f4x5 .proof-strip { width: 100%; height: 400px; }
.proof-num { font: 700 150px/1 "UI"; letter-spacing: -0.03em; }
.proof-num span { color: var(--mute); font-weight: 400; }
.proof-num.z { margin-top: 36px; color: var(--accent); }
.proof-sub { font: 400 34px "UI"; color: var(--mute); margin-top: 6px; }
.f4x5 .proof-num { font-size: 120px; }
.cta-name { font: 700 76px "UI"; letter-spacing: -0.02em; }
.cta-url { font: 36px "Code"; color: var(--accent); margin-top: 18px; }
.cta-sub { font: 400 26px "UI"; color: var(--mute); margin-top: 22px; }
.f4x5 .cta-name { font-size: 64px; } .f4x5 .cta-url { font-size: 27px; }
</style>
</head>

<script src="motion.js"></script>

</body>
</html>
